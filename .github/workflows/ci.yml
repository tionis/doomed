name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.0"

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          VITE_INSTANT_APP_ID: ${{ secrets.VITE_INSTANT_APP_ID }}
