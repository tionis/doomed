---
name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-site-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.0"
      - name: Install and typecheck
        run: |
          bun install
          bun run lint
      - name: Build website
        env:
          VITE_INSTANT_APP_ID: ${{ secrets.VITE_INSTANT_APP_ID }}
          VITE_BASE_PATH: /
        run: bun run build
      - name: Validate production configuration
        if: github.event_name != 'pull_request'
        env:
          VITE_INSTANT_APP_ID: ${{ secrets.VITE_INSTANT_APP_ID }}
        run: test -n "$VITE_INSTANT_APP_ID"
      - name: Deploy to Bunny
        if: github.event_name != 'pull_request'
        env:
          BUNNY_STORAGE_ZONE: doomed-tionis-dev
          BUNNY_STORAGE_ENDPOINT: storage.bunnycdn.com
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_PURGE_ENDPOINT: https://tionis-static-site-purge.bunny.run
        run: |
          curl -fsSL \
            https://forge.tionis.dev/actions/static-site-deploy/raw/commit/86964aa187a7cc6519ed9bf45f1e9f0999fd7bf8/static_site.py \
            -o /tmp/static-site.py
          echo '5f9a3e8ca730803ab5d83a58b2d972ae97ba5424fa113a0ff011775b2638ec2e  /tmp/static-site.py' |
            sha256sum --check
          python3 /tmp/static-site.py bunny dist/client
