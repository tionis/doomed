name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    name: Typecheck, build, and container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.0"

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run lint

      - name: Build app
        run: bun run build

      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman

      - name: Build container image with Podman
        run: podman build --file Containerfile --tag judged-by-ai:${{ github.sha }} .
